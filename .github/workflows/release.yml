name: Release

on:
  push:
    tags: [ 'v*' ]
  # Allows a dry run (build the artifacts, publish nothing) from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compiled from the arm64 runner: sweepkit is pure Rust, so the
          # bundled Apple SDK is enough and we avoid depending on the
          # x86_64 macOS runner images.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.97
      with:
        targets: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package
      id: package
      shell: bash
      # TAG comes in through the environment rather than being interpolated
      # into the script body, so it is never treated as shell syntax.
      env:
        TAG: ${{ github.ref_name }}
        TARGET: ${{ matrix.target }}
        ARCHIVE: ${{ matrix.archive }}
      run: |
        set -euo pipefail
        version="${TAG#v}"
        name="sweepkit-${version}-${TARGET}"
        mkdir -p "dist/${name}"
        if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
          cp "target/${TARGET}/release/sweepkit.exe" "dist/${name}/"
        else
          cp "target/${TARGET}/release/sweepkit" "dist/${name}/"
        fi
        cp README.md LICENSE "dist/${name}/"
        cd dist
        if [ "$ARCHIVE" = "zip" ]; then
          7z a "${name}.zip" "${name}"
        else
          tar czf "${name}.tar.gz" "${name}"
        fi
        echo "asset=dist/${name}.${ARCHIVE}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sweepkit-${{ matrix.target }}
        path: ${{ steps.package.outputs.asset }}
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag push cuts a release; a manual dispatch stops after build.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        fail_on_unmatched_files: true
